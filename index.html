<meta charset="utf-8">
<title>WORDSHIFT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap">
<style>
/* Layout: one 4:3 pixel screen (256x192 internal) with SNES-style windows layered on top; touch pad below on phones.
   --u = one internal pixel in CSS px, set from JS so every window scales with the screen. Single dark look by design. */
:root {
  --night: #070912; --ink: #0b0e1c; --win1: #22307a; --win2: #0f1745; --line: #f2eee2; --edge: #3e50a8;
  --text: #f6f3ea; --dim: #9aa3c8; --gold: #ffcf5a; --gold2: #b8862a; --red: #ff5d5d; --paper: #f1e8cf; --teal: #6fe0cc; --grn: #9be28a;
  --f-jp: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", monospace;
  --f-px: "Press Start 2P", "DotGothic16", monospace;
  --u: 2px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); background-image: radial-gradient(ellipse at 50% 0%, #141a3a 0%, var(--night) 60%); color: var(--text); font-family: var(--f-jp);
  overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
#app { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding-inline: 16px; padding-block: 10px; }
#screen { position: relative; overflow: hidden; background: #000; border-radius: calc(var(--u) * 3); isolation: isolate; flex: none;
  box-shadow: 0 0 0 2px #232a52, 0 0 0 6px #0c0f22, 0 20px 60px rgba(0,0,0,.65); font-size: calc(var(--u) * 8.5); line-height: 1.55; }
#screen.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translate(calc(var(--u)*-3), calc(var(--u)*1)); } 40% { transform: translate(calc(var(--u)*3), calc(var(--u)*-1)); } 60% { transform: translate(calc(var(--u)*-2), 0); } 80% { transform: translate(calc(var(--u)*1), calc(var(--u)*1)); } }
#cv { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

.win { position: absolute; box-sizing: border-box; background: linear-gradient(180deg, var(--win1), var(--win2)); color: var(--text);
  border: calc(var(--u) * 1) solid var(--line); border-radius: calc(var(--u) * 3);
  box-shadow: 0 0 0 calc(var(--u) * 1) #0a0c18, inset 0 0 0 calc(var(--u) * 1) var(--edge), 0 calc(var(--u) * 2) 0 rgba(0,0,0,.35);
  text-shadow: calc(var(--u) * .6) calc(var(--u) * .6) 0 #070915; }
.w { color: var(--gold); } .r { color: var(--red); }
.acc { font-family: var(--f-jp); font-size: 1.3em; line-height: 1; letter-spacing: 0; }
.next { color: var(--gold); animation: bob .7s steps(2) infinite; }
@keyframes bob { 50% { transform: translateY(calc(var(--u) * 1.5)); } }

/* dialogue */
#msg { left: calc(var(--u)*4); right: calc(var(--u)*4); bottom: calc(var(--u)*4); min-height: calc(var(--u)*50); padding: calc(var(--u)*6) calc(var(--u)*9);
  z-index: 60; display: flex; gap: calc(var(--u)*7); align-items: flex-start; cursor: pointer; }
#msg .name { position: absolute; top: calc(var(--u)*-10); left: calc(var(--u)*6); padding: 0 calc(var(--u)*5); font-size: calc(var(--u)*7.5); line-height: calc(var(--u)*13);
  background: linear-gradient(180deg, #3a4aa0, #1a2560); border: calc(var(--u)*1) solid var(--line); border-radius: calc(var(--u)*2); color: #fff3cf; }
#msg.hasface .name { left: calc(var(--u)*6); }
#face { flex: none; width: calc(var(--u)*24); height: calc(var(--u)*30); image-rendering: pixelated; background: radial-gradient(circle at 50% 40%, #3a4aa0, #121a4a);
  border: calc(var(--u)*1) solid var(--edge); border-radius: calc(var(--u)*2); margin-top: calc(var(--u)*2); }
#msg .txt { flex: 1; min-width: 0; font-size: calc(var(--u)*8.5); letter-spacing: .02em; }
#msg.narr .txt { color: #ebe5d2; }
#msg .next { position: absolute; right: calc(var(--u)*7); bottom: calc(var(--u)*3); font-size: calc(var(--u)*6); }

/* choices */
#choice { right: calc(var(--u)*4); bottom: calc(var(--u)*57); z-index: 62; padding: calc(var(--u)*4); display: flex; flex-direction: column; gap: calc(var(--u)*1);
  min-width: calc(var(--u)*104); max-width: calc(var(--u)*246); }
#choice.side { bottom: calc(var(--u)*4); width: calc(var(--u)*106); min-width: 0; }
#choice.side .opt { font-size: calc(var(--u)*7); padding-inline: calc(var(--u)*2); }
#choice.side .opt .chip { font-size: calc(var(--u)*4); padding: calc(var(--u)*1) calc(var(--u)*2); }
.opt { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: calc(var(--u)*3); padding: calc(var(--u)*1.5) calc(var(--u)*4); cursor: pointer;
  border-radius: calc(var(--u)*2); font-size: calc(var(--u)*8.5); line-height: 1.4; }
.opt .cur { color: var(--gold); visibility: hidden; flex: none; font-size: .8em; }
.opt.sel { background: rgba(255,255,255,.09); } .opt.sel .cur { visibility: visible; }
.opt:focus-visible { outline: calc(var(--u)*1) solid var(--gold); }
.opt .ot { min-width: 0; }
.opt.lens .ot { color: #ffe6a6; }
.opt.special .ot { color: var(--teal); }
.opt .sm { filter: blur(calc(var(--u)*1.1)); opacity: .55; color: #ffb4a8; }
.opt.smudged .ot { color: #c9cde0; }
.fixnote { font-size: calc(var(--u)*6); color: #ffb4a8; padding: 0 calc(var(--u)*4) calc(var(--u)*2); border-bottom: calc(var(--u)*.6) dashed rgba(255,140,120,.5); margin-bottom: calc(var(--u)*1); }
.fixnote b { color: var(--gold); font-weight: normal; }
.opt .chip { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: calc(var(--u)*2); font-family: var(--f-px); font-size: calc(var(--u)*4.5); letter-spacing: 0;
  background: var(--gold); color: #24180a; text-shadow: none; padding: calc(var(--u)*1.5) calc(var(--u)*3); border-radius: calc(var(--u)*2); }
.opt .chip img { width: calc(var(--u)*7); height: calc(var(--u)*7); image-rendering: pixelated; }
.opt.trap .chip { background: var(--paper); color: #b0281d; box-shadow: 0 0 0 calc(var(--u)*.7) #c0392b; }
.opt.pull { animation: pull 1s ease-in-out infinite; }
@keyframes pull { 50% { background: rgba(255,207,90,.22); } }

/* lens hint */
#lensbox { left: calc(var(--u)*14); right: calc(var(--u)*14); top: calc(var(--u)*16); z-index: 61; padding: calc(var(--u)*7) calc(var(--u)*9) calc(var(--u)*9);
  background: linear-gradient(180deg, #3a2a0e, #1d1406); border-color: #ffe29a; box-shadow: 0 0 0 calc(var(--u)*1) #0a0c18, inset 0 0 0 calc(var(--u)*1) var(--gold2), 0 0 calc(var(--u)*18) rgba(255,200,90,.35);
  cursor: pointer; animation: lensIn .35s ease-out; }
@keyframes lensIn { from { opacity: 0; transform: translateY(calc(var(--u)*-6)); } }
#lensbox .lh { display: flex; align-items: center; gap: calc(var(--u)*4); font-family: var(--f-px); font-size: calc(var(--u)*5.5); color: var(--gold); margin-bottom: calc(var(--u)*4); }
#lensbox .lh img { width: calc(var(--u)*10); height: calc(var(--u)*10); image-rendering: pixelated; }
#lensbox .lt { font-size: calc(var(--u)*8.5); color: #fff6dc; }
#lensbox .next { position: absolute; right: calc(var(--u)*7); bottom: calc(var(--u)*2); font-size: calc(var(--u)*6); }

/* HUD, banners, toasts */
#track { all: unset; position: absolute; box-sizing: border-box; left: calc(var(--u)*4); top: calc(var(--u)*4); z-index: 22; max-width: 62%; cursor: pointer;
  display: flex; align-items: flex-start; gap: calc(var(--u)*3); padding: calc(var(--u)*2) calc(var(--u)*4); border-radius: calc(var(--u)*2.5);
  background: rgba(10,14,40,.82); box-shadow: inset 0 0 0 calc(var(--u)*.7) rgba(255,207,90,.55), 0 calc(var(--u)*1) 0 rgba(0,0,0,.35);
  font-size: calc(var(--u)*6.6); line-height: 1.4; color: var(--text); text-shadow: 0 calc(var(--u)*.6) 0 #000; }
#track .tk { flex: none; font-family: var(--f-px); font-size: calc(var(--u)*4.2); color: #24180a; background: var(--gold); padding: calc(var(--u)*1) calc(var(--u)*2); border-radius: calc(var(--u)*1.5); text-shadow: none; margin-top: calc(var(--u)*.6); }
#track .th { flex: none; width: calc(var(--u)*7); height: calc(var(--u)*7); border-radius: 50%; display: grid; place-items: center; font-size: calc(var(--u)*5); background: rgba(255,255,255,.12); color: var(--gold); margin-top: calc(var(--u)*.6); }
#track:focus-visible { outline: calc(var(--u)*1) solid var(--gold); }
#track.pulse { animation: tpulse 1.4s ease-out; }
@keyframes tpulse { 0% { box-shadow: inset 0 0 0 calc(var(--u)*.7) var(--gold), 0 0 0 0 rgba(255,207,90,.8); } 60% { box-shadow: inset 0 0 0 calc(var(--u)*.7) var(--gold), 0 0 0 calc(var(--u)*8) rgba(255,207,90,0); } }
#screen.inbattle #track, #screen.inbattle #hud, #screen.inbattle #loc { display: none; }
#screen.enc::after { content: ''; position: absolute; inset: 0; z-index: 80; pointer-events: none; animation: enc .45s steps(6); }
@keyframes enc { 0%, 33%, 66% { background: #fff; } 16%, 50%, 83% { background: #000; } 100% { background: transparent; } }
#screen.hurt::after { content: ''; position: absolute; inset: 0; z-index: 80; pointer-events: none; animation: hurtf .35s ease-out; }
@keyframes hurtf { from { background: rgba(255,40,40,.45); } to { background: rgba(255,40,40,0); } }
.hhp { display: flex; align-items: center; gap: calc(var(--u)*2); padding: calc(var(--u)*1) calc(var(--u)*3); border-radius: calc(var(--u)*2); background: rgba(10,14,40,.78);
  box-shadow: inset 0 0 0 calc(var(--u)*.7) rgba(242,238,226,.4); font-family: var(--f-px); font-size: calc(var(--u)*4.2); color: #fff; }
.hhp .hn { font-variant-numeric: tabular-nums; }
.hpbar { display: inline-block; width: calc(var(--u)*30); height: calc(var(--u)*3.5); border-radius: calc(var(--u)*2); background: rgba(0,0,0,.5); box-shadow: inset 0 0 0 calc(var(--u)*.5) rgba(255,255,255,.3); overflow: hidden; }
.hpbar i { display: block; height: 100%; background: linear-gradient(90deg, #5fd4a0, #9be28a); transition: width .3s; }
.hpbar.low i { background: linear-gradient(90deg, #ff5d5d, #ff9d6a); }
/* battle HUD */
#bui { position: absolute; inset: 0; z-index: 25; pointer-events: none; }
#bui .bename { position: absolute; top: calc(var(--u)*5); left: 50%; transform: translateX(-50%); font-size: calc(var(--u)*7.5); padding: 0 calc(var(--u)*6); border-radius: calc(var(--u)*6);
  background: rgba(8,10,28,.8); white-space: nowrap; text-shadow: 0 calc(var(--u)*.6) 0 #000; }
#bui .bbar { position: absolute; top: calc(var(--u)*18); left: 50%; transform: translateX(-50%); width: calc(var(--u)*90); height: calc(var(--u)*4); border-radius: calc(var(--u)*2); background: rgba(0,0,0,.55); box-shadow: inset 0 0 0 calc(var(--u)*.6) rgba(255,255,255,.35); overflow: hidden; }
#bui .bbar i { display: block; height: 100%; background: linear-gradient(90deg, #b06ae0, #f08ad0); transition: width .4s; }
#bui .bstat { left: calc(var(--u)*4); top: calc(var(--u)*4); padding: calc(var(--u)*3) calc(var(--u)*5); font-size: calc(var(--u)*6.5); display: flex; flex-direction: column; gap: calc(var(--u)*1.5); }
#bui .bsl { font-family: var(--f-px); font-size: calc(var(--u)*4.5); color: var(--gold); }
#bui .hpbar { width: calc(var(--u)*50); }
#bui .bwords { display: flex; gap: calc(var(--u)*2); }
#bui .bwords img { width: calc(var(--u)*8); height: calc(var(--u)*8); image-rendering: pixelated; }
.opt .oi { width: calc(var(--u)*8); height: calc(var(--u)*8); image-rendering: pixelated; flex: none; }
#loc { left: 50%; transform: translateX(-50%); top: calc(var(--u)*30); z-index: 20; white-space: nowrap; padding: calc(var(--u)*1) calc(var(--u)*7); font-size: calc(var(--u)*7.5); transition: opacity .6s; }
#loc.out { opacity: 0; }
#hud { position: absolute; right: calc(var(--u)*4); top: calc(var(--u)*4); z-index: 21; display: flex; flex-direction: column; align-items: flex-end; gap: calc(var(--u)*2); cursor: pointer; }
.hchip { display: flex; align-items: center; gap: calc(var(--u)*2); padding: calc(var(--u)*1) calc(var(--u)*3); border-radius: calc(var(--u)*2);
  background: rgba(10,14,40,.78); box-shadow: inset 0 0 0 calc(var(--u)*.7) rgba(255,207,90,.6); font-family: var(--f-px); font-size: calc(var(--u)*4.2); color: var(--gold); }
.hchip img { width: calc(var(--u)*7); height: calc(var(--u)*7); image-rendering: pixelated; }
.hchip i { font-style: normal; color: var(--red); font-family: var(--f-jp); font-size: calc(var(--u)*5); letter-spacing: -.1em; }
.hchip.hot { box-shadow: inset 0 0 0 calc(var(--u)*.7) var(--red); animation: hot 1.2s infinite; }
@keyframes hot { 50% { background: rgba(120,20,20,.7); } }
#toasts { position: absolute; left: 50%; top: calc(var(--u)*46); transform: translateX(-50%); z-index: 63; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u)*2); pointer-events: none; width: 90%; }
.toast { padding: calc(var(--u)*2) calc(var(--u)*7); border-radius: calc(var(--u)*8); background: rgba(8,10,28,.88); box-shadow: inset 0 0 0 calc(var(--u)*.7) rgba(242,238,226,.5);
  font-size: calc(var(--u)*7); text-align: center; animation: tIn .3s ease-out; transition: opacity .5s, transform .5s; }
.toast.warn { box-shadow: inset 0 0 0 calc(var(--u)*.7) var(--red); color: #ffd6d0; }
.toast.title { box-shadow: inset 0 0 0 calc(var(--u)*.7) var(--teal); color: #dffff8; }
.toast.out { opacity: 0; transform: translateY(calc(var(--u)*-4)); }
@keyframes tIn { from { opacity: 0; transform: translateY(calc(var(--u)*-4)); } }

/* fade / chapter card */
#fade { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 50; pointer-events: none; transition: opacity .3s linear; }
#card { position: absolute; inset: 0; z-index: 54; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u)*4);
  background: radial-gradient(ellipse at center, rgba(10,14,40,.85), rgba(0,0,0,.92)); opacity: 0; transition: opacity .5s; pointer-events: none; text-align: center; }
#card.in { opacity: 1; } #card.out { opacity: 0; }
#card .ct { font-family: var(--f-px); font-size: calc(var(--u)*6.5); color: var(--gold); letter-spacing: .2em; }
#card .cn { font-size: calc(var(--u)*17); letter-spacing: .12em; text-shadow: 0 0 calc(var(--u)*8) rgba(255,207,90,.35); }
#card .cs { font-size: calc(var(--u)*8); color: var(--dim); }
#card .ct::before, #card .ct::after { content: ''; display: inline-block; width: calc(var(--u)*18); height: calc(var(--u)*1); background: var(--gold2); vertical-align: middle; margin: 0 calc(var(--u)*5); }

/* NEW WORD ACQUIRED */
#acq { position: absolute; inset: 0; z-index: 52; background: rgba(3,4,14,.86); display: grid; place-items: center; overflow: hidden; cursor: pointer; }
#acq .rays { position: absolute; width: 180%; aspect-ratio: 1; left: -40%; top: 50%; translate: 0 -50%; max-width: none;
  background: repeating-conic-gradient(from 0deg, rgba(255,207,90,.07) 0deg 8deg, transparent 8deg 22deg); mask: radial-gradient(circle, #000 10%, transparent 60%);
  -webkit-mask: radial-gradient(circle, #000 10%, transparent 60%); animation: spin 18s linear infinite; }
@keyframes spin { to { rotate: 360deg; } }
#acq .ac { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: calc(var(--u)*2.5); width: 86%; }
#acq .ah { font-family: var(--f-px); font-size: calc(var(--u)*7.5); color: var(--gold); text-shadow: 0 calc(var(--u)*1) 0 #6a4200; letter-spacing: .05em; }
#acq .ai { width: calc(var(--u)*30); height: calc(var(--u)*30); image-rendering: pixelated; filter: drop-shadow(0 0 calc(var(--u)*6) rgba(255,207,90,.7)); }
#acq .an { font-family: var(--f-px); font-size: calc(var(--u)*13); color: #fff; letter-spacing: .08em; text-shadow: 0 calc(var(--u)*1.5) 0 var(--gold2), 0 0 calc(var(--u)*10) rgba(255,207,90,.6); }
#acq .al { font-size: calc(var(--u)*7); color: var(--dim); margin-top: calc(var(--u)*-1); }
#acq .ad { font-size: calc(var(--u)*8.5); max-width: 92%; text-wrap: balance; }
#acq .ae { font-size: calc(var(--u)*7); color: #dfe3f5; display: flex; text-wrap: pretty; gap: calc(var(--u)*3); align-items: baseline; text-align: left; max-width: 96%; }
#acq .next { font-size: calc(var(--u)*6); }
#acq.show .ah { animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
#acq.show .ai { animation: drop .7s cubic-bezier(.2,1.4,.4,1) .1s both; }
#acq.show .an { animation: pop .6s cubic-bezier(.2,1.6,.4,1) .35s both; }
#acq.show .al, #acq.show .ad, #acq.show .ae, #acq.show .next { animation: fadeUp .5s ease-out .7s both; }
@keyframes pop { from { opacity: 0; transform: scale(.4); } }
@keyframes drop { from { opacity: 0; transform: translateY(calc(var(--u)*-30)) rotate(-20deg); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(calc(var(--u)*4)); } }
.k { flex: none; font-size: calc(var(--u)*6); padding: 0 calc(var(--u)*3); border-radius: calc(var(--u)*1.5); color: #10121c; text-shadow: none; }
.k.good { background: var(--teal); } .k.bad { background: #ff8d7d; }

/* LABELED! / PEELED */
#stamp, #peel { position: absolute; inset: 0; z-index: 53; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u)*7); pointer-events: none; }
#stamp.go { animation: redflash 1.7s ease-out; }
@keyframes redflash { 0% { background: rgba(255,60,40,.55); } 25% { background: rgba(60,0,0,.45); } 100% { background: rgba(0,0,0,0); } }
#stamp .sb { font-family: var(--f-px); font-size: calc(var(--u)*17); color: #e8392a; padding: calc(var(--u)*5) calc(var(--u)*8);
  border: calc(var(--u)*2.5) double #e8392a; border-radius: calc(var(--u)*3); background: rgba(241,232,207,.95); rotate: -11deg; text-shadow: none;
  box-shadow: 0 calc(var(--u)*3) 0 rgba(0,0,0,.4); }
#stamp.go .sb { animation: stampIn .28s cubic-bezier(.3,1.5,.6,1) both; }
@keyframes stampIn { from { opacity: 0; scale: 2.6; } }
#stamp .ss { font-size: calc(var(--u)*8); background: rgba(10,10,20,.88); padding: calc(var(--u)*2) calc(var(--u)*8); border-radius: calc(var(--u)*8); }
#stamp .ss b { color: var(--gold); font-weight: normal; }
#peel .tag { font-family: var(--f-px); font-size: calc(var(--u)*9); color: #c0392b; background: var(--paper); padding: calc(var(--u)*4) calc(var(--u)*7); box-shadow: 0 0 0 calc(var(--u)*1) #c0392b; }
#peel.go .tag { animation: peelOff 1.3s cubic-bezier(.5,0,.8,.4) both; }
@keyframes peelOff { 0% { transform: none; } 25% { transform: rotate(-6deg) translateY(calc(var(--u)*-3)); } 100% { transform: translate(calc(var(--u)*90), calc(var(--u)*-110)) rotate(60deg); opacity: 0; } }
#peel .ps { font-family: var(--f-px); font-size: calc(var(--u)*7); color: var(--teal); text-shadow: 0 0 calc(var(--u)*6) rgba(111,224,204,.6); }
#peel.go .ps { animation: fadeUp .5s ease-out .5s both; }

/* testimony board */
#board { position: absolute; left: calc(var(--u)*4); top: calc(var(--u)*4); bottom: calc(var(--u)*4); right: calc(var(--u)*114); z-index: 30; box-sizing: border-box;
  padding: calc(var(--u)*4) calc(var(--u)*5); display: flex; flex-direction: column; gap: calc(var(--u)*2.5); overflow: auto;
  background: linear-gradient(180deg, #3b2a18, #20160c); border: calc(var(--u)*1) solid #e9d6a8; border-radius: calc(var(--u)*3); box-shadow: inset 0 0 0 calc(var(--u)*1) #7a5a2a; }
.bh { font-size: calc(var(--u)*8); color: var(--gold); }
.bcard { background: #f1e8cf; color: #2a1e10; border-radius: calc(var(--u)*1.5); padding: calc(var(--u)*1.5) calc(var(--u)*4); box-shadow: 0 calc(var(--u)*1) 0 rgba(0,0,0,.4); }
.bw { font-size: calc(var(--u)*6); color: #7a5a2a; }
.bq { font-size: calc(var(--u)*7.5); line-height: 1.4; }
.bq .ag { font-style: normal; color: #c0392b; text-decoration: underline; text-underline-offset: calc(var(--u)*1.5); }
